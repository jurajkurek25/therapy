server {
    listen 80;
    server_name teraplan.eu www.teraplan.eu;

    # Redirect all HTTP to HTTPS
    return 301 https://teraplan.eu$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.teraplan.eu;

    ssl_certificate     /etc/letsencrypt/live/teraplan.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teraplan.eu/privkey.pem;

    return 301 https://teraplan.eu$request_uri;
}

server {
    listen 443 ssl http2;
    server_name teraplan.eu;

    ssl_certificate     /etc/letsencrypt/live/teraplan.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teraplan.eu/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Next.js static assets — aggressive caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:9999;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public folder
    location /public/ {
        proxy_pass http://127.0.0.1:9999;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else → Next.js app
    location / {
        proxy_pass         http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

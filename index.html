<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teraplan — Kredity na terapiu, ktorá vám sadne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f2f6f4;
    --bg-2: #e5ede8;
    --ink: #1b2e25;
    --ink-2: #2d4438;
    --muted: #567064;
    --muted-2: #88a496;
    --rule: #c8d8cf;
    --rule-2: #b4c9bc;
    --accent: oklch(0.56 0.12 165);
    --accent-ink: oklch(0.34 0.09 165);
    --accent-tint: oklch(0.95 0.04 165);
    --paper: #f8fbf9;
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    font-size: 16px;
    line-height: 1.55;
    font-feature-settings: "ss01", "cv11";
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  .wrap-narrow { max-width: 920px; margin: 0 auto; padding: 0 32px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-weight: 500;
  }
  .num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.005em;
    border-radius: 999px;
    transition: all 0.18s ease;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--bg);
  }
  .btn-primary:hover { background: var(--ink-2); transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--rule-2);
  }
  .btn-ghost:hover { background: var(--paper); border-color: var(--ink); }

  .rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }

  .section-head {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 64px;
    padding: 24px 0;
    align-items: end;
    border-bottom: 1px solid var(--ink);
  }
  .section-head h2 {
    font-family: var(--serif);
    font-size: clamp(40px, 5vw, 64px);
    line-height: 1.0;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .section-head .section-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  @media (max-width: 760px) {
    .section-head { grid-template-columns: 1fr; gap: 24px; }
  }

  /* Nav */
  nav.top {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px;
    max-width: 1240px; margin: 0 auto;
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--serif); font-size: 22px; letter-spacing: -0.02em;
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    align-self: center;
    transform: translateY(-1px);
  }
  .nav-links {
    display: flex; gap: 28px;
    font-size: 13px; color: var(--ink-2);
  }
  .nav-links a:hover { color: var(--accent-ink); }
  @media (max-width: 860px) { .nav-links { display: none; } }

  /* Hero */
  .hero {
    padding: 96px 0 80px;
    border-bottom: 1px solid var(--ink);
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 7fr 5fr;
    gap: 80px;
    align-items: end;
  }
  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(56px, 8vw, 112px);
    line-height: 0.92;
    letter-spacing: -0.025em;
    margin: 0;
    font-weight: 400;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--accent-ink);
  }
  .hero-sub {
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink-2);
    max-width: 44ch;
    margin: 0 0 28px;
  }
  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-meta {
    display: flex; gap: 32px; margin-top: 56px;
    padding-top: 24px; border-top: 1px solid var(--rule);
    flex-wrap: wrap;
  }
  .hero-meta .stat .v {
    font-family: var(--serif); font-size: 32px; line-height: 1;
  }
  .hero-meta .stat .l {
    font-size: 12px; color: var(--muted); margin-top: 6px;
  }
  @media (max-width: 960px) {
    .hero-grid { grid-template-columns: 1fr; gap: 32px; }
    .hero { padding: 56px 0 56px; }
  }

  /* Equation panel — 1 € = 1 kredit */
  .equation {
    margin-top: 64px;
    padding: 40px 32px;
    background: var(--ink);
    color: var(--bg);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px;
    align-items: center;
  }
  .equation .eq-cell {
    text-align: center;
  }
  .equation .eq-op {
    font-family: var(--serif);
    font-size: 56px;
    line-height: 1;
    opacity: 0.6;
  }
  .equation .eq-val {
    font-family: var(--serif);
    font-size: 48px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .equation .eq-label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.6;
  }
  @media (max-width: 760px) {
    .equation { grid-template-columns: 1fr; gap: 12px; padding: 32px 24px; }
    .equation .eq-op { font-size: 28px; }
    .equation .eq-val { font-size: 36px; }
  }

  /* Problem */
  .problem {
    padding: 80px 0;
  }
  .problem-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-top: 48px;
    border-top: 1px solid var(--rule);
  }
  .problem-cell {
    padding: 32px 28px 32px 0;
    border-right: 1px solid var(--rule);
  }
  .problem-cell:last-child { border-right: none; padding-right: 0; }
  .problem-cell:not(:first-child) { padding-left: 28px; }
  .problem-cell .big {
    font-family: var(--serif);
    font-size: 64px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .problem-cell h4 {
    font-size: 16px; font-weight: 600; margin: 0 0 8px;
  }
  .problem-cell p {
    font-size: 14px; color: var(--muted); margin: 0; line-height: 1.55;
  }
  @media (max-width: 860px) {
    .problem-grid { grid-template-columns: 1fr; }
    .problem-cell { border-right: none; border-bottom: 1px solid var(--rule); padding: 24px 0; }
    .problem-cell:not(:first-child) { padding-left: 0; }
  }

  /* Solution */
  .solution {
    padding: 80px 0;
    background: var(--paper);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .solution-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
  }
  .solution h2 {
    font-family: var(--serif);
    font-size: clamp(40px, 5vw, 56px);
    line-height: 1.0;
    margin: 0 0 24px;
    letter-spacing: -0.02em;
  }
  .solution p {
    font-size: 16px; line-height: 1.6; color: var(--ink-2);
    max-width: 48ch;
  }

  /* Voucher mock */
  .voucher {
    background: var(--bg);
    border: 1px solid var(--ink);
    padding: 28px;
    position: relative;
    aspect-ratio: 8 / 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .voucher::before, .voucher::after {
    content: "";
    position: absolute;
    width: 24px; height: 24px;
    background: var(--paper);
    border-radius: 50%;
    border: 1px solid var(--ink);
    top: 50%;
    transform: translateY(-50%);
  }
  .voucher::before { left: -13px; }
  .voucher::after { right: -13px; }
  .voucher .v-head {
    display: flex; justify-content: space-between;
    border-bottom: 1px dashed var(--rule-2);
    padding-bottom: 14px;
  }
  .voucher .v-amount {
    font-family: var(--serif);
    font-size: 80px;
    line-height: 1;
    letter-spacing: -0.03em;
    margin: 32px 0 12px;
  }
  .voucher .v-amount sup { font-size: 24px; vertical-align: super; opacity: 0.5; }
  .voucher .v-partner {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent-ink);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .voucher .v-code {
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: 0.18em;
    padding: 14px 0;
    border-top: 1px dashed var(--rule-2);
    border-bottom: 1px dashed var(--rule-2);
    text-align: center;
    margin: 12px 0;
  }
  .voucher .v-foot {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex; justify-content: space-between;
  }
  @media (max-width: 860px) {
    .solution-grid { grid-template-columns: 1fr; gap: 32px; }
  }

  /* Steps */
  .steps {
    padding: 80px 0;
  }
  .step-row {
    display: grid;
    grid-template-columns: 80px 1fr 2fr 1fr;
    gap: 32px;
    padding: 32px 0;
    border-bottom: 1px solid var(--rule);
    align-items: start;
    transition: background 0.2s;
  }
  .step-row:hover { background: var(--paper); }
  .step-row .step-num {
    font-family: var(--serif);
    font-size: 48px;
    line-height: 1;
    color: var(--ink);
  }
  .step-row .step-title {
    font-family: var(--serif);
    font-size: 28px;
    line-height: 1.05;
    letter-spacing: -0.015em;
  }
  .step-row .step-desc {
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.55;
    max-width: 44ch;
  }
  .step-row .step-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: right;
  }
  @media (max-width: 860px) {
    .step-row { grid-template-columns: 60px 1fr; }
    .step-row .step-tag { display: none; }
    .step-row .step-desc { grid-column: 2; }
  }

  /* Features */
  .features { padding: 80px 0; background: var(--paper); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .feature {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    padding: 64px 0;
    border-bottom: 1px solid var(--rule);
    align-items: center;
  }
  .feature:last-child { border-bottom: none; padding-bottom: 0; }
  .feature:first-child { padding-top: 0; }
  .feature.reverse > div:first-child { order: 2; }
  .feature h3 {
    font-family: var(--serif);
    font-size: clamp(32px, 3.5vw, 44px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 12px 0 16px;
  }
  .feature p {
    font-size: 16px; line-height: 1.6; color: var(--ink-2);
    max-width: 48ch;
  }
  @media (max-width: 860px) {
    .feature { grid-template-columns: 1fr; gap: 24px; padding: 48px 0; }
    .feature.reverse > div:first-child { order: initial; }
  }

  /* AI chat mock */
  .ai-mock {
    background: var(--bg);
    border: 1px solid var(--rule-2);
    padding: 24px;
    font-size: 14px;
    line-height: 1.5;
  }
  .ai-mock .ai-head {
    display: flex; justify-content: space-between;
    padding-bottom: 14px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  .ai-mock .ai-head .l {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .ai-mock .ai-head .l .live-dot { margin-right: 6px; }
  .ai-mock .msg {
    padding: 12px 0;
    border-top: 1px solid var(--rule);
  }
  .ai-mock .msg:first-of-type { border-top: none; }
  .ai-mock .msg .who {
    font-family: var(--mono); font-size: 10px;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .ai-mock .msg.ai .who { color: var(--accent-ink); }
  .ai-mock .msg .body { color: var(--ink); }
  .ai-mock .msg.ai .body em { font-style: normal; font-weight: 500; color: var(--accent-ink); }
  .ai-mock .recommendation {
    margin-top: 14px;
    padding: 14px;
    background: var(--accent-tint);
    border: 1px solid var(--accent);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .ai-mock .recommendation .name {
    font-family: var(--serif); font-size: 18px;
    color: var(--accent-ink);
  }
  .ai-mock .recommendation .meta {
    font-family: var(--mono); font-size: 11px;
    color: var(--accent-ink); opacity: 0.8;
    margin-top: 2px;
  }
  .ai-mock .recommendation .platform {
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.1em;
    padding: 6px 10px;
    background: var(--accent-ink); color: var(--bg);
  }
  .ai-mock .composer {
    margin-top: 14px;
    display: flex; gap: 10px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  .ai-mock .composer .input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--rule-2);
    background: var(--paper);
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }
  .ai-mock .composer .send {
    background: var(--ink); color: var(--bg);
    padding: 10px 18px;
    font-size: 13px;
    font-family: var(--mono);
  }

  /* Credits ledger mock */
  .credits-mock {
    background: var(--ink);
    color: var(--bg);
    padding: 32px;
    font-family: var(--sans);
  }
  .credits-mock .c-head {
    display: flex; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 16px; margin-bottom: 24px;
  }
  .credits-mock .c-head .l { font-family: var(--mono); font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.1em; }
  .credits-mock .c-row {
    display: grid; grid-template-columns: 1fr auto 90px;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    align-items: baseline;
    font-size: 14px;
  }
  .credits-mock .c-row .y { font-family: var(--mono); font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.1em; }
  .credits-mock .c-row .d { opacity: 0.85; }
  .credits-mock .c-row .v { font-family: var(--serif); font-size: 22px; text-align: right; }
  .credits-mock .c-row .v.minus { opacity: 0.7; }
  .credits-mock .c-total {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-top: 24px; margin-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.3);
  }
  .credits-mock .c-total .v {
    font-family: var(--serif);
    font-size: 56px;
    line-height: 1;
    color: var(--bg);
  }
  .credits-mock .c-total .v sup { font-size: 14px; vertical-align: super; opacity: 0.5; margin-left: 4px; }
  .credits-mock .c-total .l { font-size: 12px; font-family: var(--mono); opacity: 0.6; text-transform: uppercase; letter-spacing: 0.1em; }
  .credits-mock .c-topup {
    margin-top: 16px;
    display: flex; gap: 8px;
  }
  .credits-mock .c-topup .chip {
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--bg);
  }
  .credits-mock .c-topup .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink);
  }

  /* Partners panel */
  .partners {
    padding: 64px 0;
    border-bottom: 1px solid var(--rule);
  }
  .partners-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 64px;
    align-items: center;
  }
  .partners-grid h3 {
    font-family: var(--serif);
    font-size: clamp(28px, 3vw, 40px);
    line-height: 1.05;
    margin: 0;
    letter-spacing: -0.015em;
  }
  .partners-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .partner-card {
    border: 1px solid var(--rule-2);
    padding: 24px;
    background: var(--paper);
  }
  .partner-card .pname {
    font-family: var(--serif);
    font-size: 32px;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .partner-card .purl {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: lowercase;
    letter-spacing: 0.05em;
  }
  .partner-card p {
    font-size: 13px;
    color: var(--ink-2);
    margin: 16px 0 0;
    line-height: 1.5;
  }
  @media (max-width: 860px) {
    .partners-grid { grid-template-columns: 1fr; gap: 24px; }
    .partners-list { grid-template-columns: 1fr; }
  }

  /* Pricing */
  .pricing { padding: 80px 0; }
  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin-top: 56px;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
  }
  .plan {
    padding: 36px 28px;
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column;
    background: var(--bg);
    transition: background 0.2s;
  }
  .plan:last-child { border-right: none; }
  .plan.featured { background: var(--paper); position: relative; }
  .plan.featured::before {
    content: "Najčastejšia voľba";
    position: absolute;
    top: -1px; left: 0;
    background: var(--ink); color: var(--bg);
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 6px 12px;
  }
  .plan-head {
    padding-bottom: 24px;
    border-bottom: 1px solid var(--rule);
  }
  .plan-name {
    font-family: var(--serif);
    font-size: 32px;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }
  .plan-tag {
    font-size: 13px; color: var(--muted); margin: 0;
  }
  .plan-price {
    padding: 24px 0;
    border-bottom: 1px solid var(--rule);
  }
  .plan-price .amt {
    font-family: var(--serif);
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .plan-price .euro { font-size: 28px; opacity: 0.5; }
  .plan-price .per {
    font-size: 12px; color: var(--muted);
    font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.1em; margin-top: 6px;
  }
  .plan-price .credits {
    margin-top: 14px;
    padding: 8px 12px;
    background: var(--accent-tint);

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

          Upozornenie: Teraplan je predplatená kreditová peňaženka určená na nákup darčekových kódov u partnerských platforiem (Hedepy, Ksebe, Mojra). Nie je poskytovateľom psychologických služieb a nespadá pod reguláciu NBS. Sedenia vykonávajú certifikovaní odborníci u našich partnerov. V prípade akútnej krízy kontaktujte Linku dôvery Nezábudka 0800 800 566.
        </div>
      </div>
    </footer>
  );
}

function WaitlistModal({ onClose }) {
  const [email, setEmail] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(false);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!email || loading) return;
    setLoading(true);
    setError(false);
    try {
      const url = 'https://docs.google.com/forms/d/e/1FAIpQLScpufBINHDezdEymlN8xvoQlqWO-uHpNPXgBjijgnVOhewHSQ/formResponse';
      const body = new URLSearchParams({ 'entry.375531769': email });
      const res = await fetch(url, { method: 'POST', mode: 'no-cors', body });
      setLoading(false);
      setSubmitted(true);
    } catch (_) {
      setLoading(false);
      setError(true);
    }
  };

  return (
    <div className="wl-overlay" onClick={onClose}>
      <div className="wl-panel" onClick={(e) => e.stopPropagation()}>
        <button className="wl-close" onClick={onClose} aria-label="Zavrieť">×</button>
        {!submitted ? (
          <>
            <div className="eyebrow">TP—WAITLIST</div>
            <h2 className="wl-heading">Ešte sme<br/><em>nespustili.</em></h2>
            <p className="wl-body">
              Teraplan sa chystá spustiť. Zanechajte nám e-mail — ozveme sa vám ako prví s prístupom a informáciou o štarte.
            </p>
            <form className="wl-form" onSubmit={handleSubmit}>
              <input
                className="wl-input"
                type="email"
                placeholder="vas@email.sk"
                value={email}
                onChange={(e) => { setEmail(e.target.value); setError(false); }}
                required
                autoFocus
              />
              <button type="submit" className="btn btn-primary wl-submit" disabled={loading}>
                {loading ? 'Odosielam…' : 'Dajte mi vedieť →'}
              </button>
            </form>
            {error && (
              <p className="wl-note" style={{ color: 'oklch(0.45 0.14 25)' }}>
                Nastala chyba pri odosielaní. Skúste neskôr alebo nás kontaktujte na <a href="mailto:hello@teraplan.eu" style={{ color: 'inherit', textDecoration: 'underline' }}>hello@teraplan.eu</a>.
              </p>
            )}
            {!error && <p className="wl-note">Žiadny spam. Jeden e-mail keď spustíme.</p>}
          </>
        ) : (
          <>
            <div className="wl-success-icon"><span className="live-dot" />Zapísané</div>
            <h2 className="wl-heading">Ozveme<br/><em>sa vám.</em></h2>
            <p className="wl-body">
              Dostali sme váš e-mail. Hneď ako Teraplan spustí, budete prví, ktorí sa dozvedia.
            </p>
            <button className="btn btn-ghost" style={{ marginTop: 8 }} onClick={onClose}>
              Zavrieť
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function applyAccent(name) {
  const a = ACCENTS[name] || ACCENTS.sage;
  const root = document.documentElement;
  root.style.setProperty('--accent', a.c);
  root.style.setProperty('--accent-ink', a.cInk);
  root.style.setProperty('--accent-tint', a.cTint);
}

function applyDensity(name) {
  if (name === 'compact') {
    document.body.style.fontSize = '15px';
  } else {
    document.body.style.fontSize = '16px';
  }
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [waitlistOpen, setWaitlistOpen] = useState(false);
  const openWaitlist = () => setWaitlistOpen(true);

  useEffect(() => {
    applyAccent(tweaks.accent);
    applyDensity(tweaks.density);
  }, [tweaks.accent, tweaks.density]);

  useEffect(() => {
    const onMessage = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMessage);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMessage);
  }, []);

  const setTweak = (k, v) => {
    setTweaks(prev => {
      const next = typeof k === 'object' ? { ...prev, ...k } : { ...prev, [k]: v };
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
      return next;
    });
  };

  const onClose = () => {
    setTweaksOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const TP = window.TweaksPanel;
  const TR = window.TweakRadio;
  const TT = window.TweakToggle;

  return (
    <>
      <Nav onBuy={openWaitlist} />
      <Hero showStats={tweaks.showStats} showEquation={tweaks.showEquation} />
      <Problem />
      <Solution />
      <HowItWorks />
      <Features />
      <Partners />
      <Pricing onBuy={openWaitlist} />
      <Support />
      <FAQ />
      <CTAFinal onBuy={openWaitlist} />
      <Footer />
      {waitlistOpen && <WaitlistModal onClose={() => setWaitlistOpen(false)} />}

      {tweaksOpen && TP && (
        <TP title="Tweaks" onClose={onClose}>
          {TR && <TR
            label="Akcentová farba"
            value={tweaks.accent}
            options={[
              { value: 'sage',   label: 'Šalvia' },
              { value: 'ink',    label: 'Atrament' },
              { value: 'rust',   label: 'Hrdza' },
              { value: 'cobalt', label: 'Kobalt' }
            ]}
            onChange={(v) => setTweak('accent', v)}
          />}
          {TR && <TR
            label="Hustota"
            value={tweaks.density}
            options={[
              { value: 'comfortable', label: 'Pohodlná' },
              { value: 'compact',     label: 'Kompaktná' }
            ]}
            onChange={(v) => setTweak('density', v)}
          />}
          {TT && <TT
            label="Rovnica 1 € = 1 kredit v hero"
            value={tweaks.showEquation}
            onChange={(v) => setTweak('showEquation', v)}
          />}
          {TT && <TT
            label="Štatistiky v hero"
            value={tweaks.showStats}
            onChange={(v) => setTweak('showStats', v)}
          />}
        </TP>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
